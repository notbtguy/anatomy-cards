{e:"❤️",t:"Circulatory System",c:"AN5.2 – 5.8",q:[

["Function of elastic arteries? Examples?","Act as pressure reservoirs, smoothing pulsatile flow. Aorta and pulmonary trunk."],

["Role of precapillary sphincters and AV anastomoses?","Sphincters regulate flow into capillary beds; AV anastomoses shunt blood past capillaries (thermoregulation)."],
["Define thrombosis, infarction, aneurysm.","Thrombosis: clot in a vessel. Infarction: tissue death from ischaemia. Aneurysm: localised abnormal dilatation of a vessel."]]},
{e:"💧",t:"Lymphatic System",c:"AN6.1 · 6.2 · 6.3",q:[
["List the components of the lymphatic system.","Lymph, lymph vessels, lymph nodes, lymphoid organs (spleen, thymus, tonsils) and diffuse lymphoid tissue."],
["Main functions of the lymphatic system?","Returns tissue fluid and proteins, absorbs fat (lacteals), immune defence."],

["Define lymphoedema and give a cause.","Swelling from lymph accumulation due to obstruction. E.g. filariasis, axillary clearance."],
["Typical routes of tumour spread: carcinoma vs sarcoma?","Carcinomas spread mainly via lymphatics; sarcomas mainly via blood."]]},

["Name the CNS glial cells.","Astrocytes, oligodendrocytes, microglia, ependymal cells. (Schwann cells in PNS.)"],

["Types of synapses by site?","Axodendritic, axosomatic, axoaxonic (also dendrodendritic); chemical or electrical."],
["Structure of a typical spinal nerve?","Dorsal (sensory) and ventral (motor) roots join; dorsal root ganglion; divides into dorsal and ventral rami."],

["Boundaries of the middle ear: contents?","Ossicles (malleus, incus, stapes), tensor tympani and stapedius, chorda tympani, tympanic plexus."],
["Name the three layers of the eyeball.","Fibrous (sclera, cornea), vascular (choroid, ciliary body, iris), nervous (retina)."]]},

["Location and parts of the thyroid gland?","Front of the neck at C5–T1; two lobes joined by an isthmus over tracheal rings 2–4."],
["Blood supply of the thyroid?","Superior thyroid artery (external carotid), inferior thyroid artery (thyrocervical trunk), thyroidea ima (occasional)."],
["Number and location of parathyroid glands?","Usually four, behind the lobes of thyroid; produce parathormone."],
["Name the zones of the adrenal cortex.","Glomerulosa, fasciculata, reticularis (GFR). Medulla secretes catecholamines."],
["What does the juxtaglomerular apparatus produce?","Renin; regulates blood pressure."]]},

["Vertebral level and position of the kidneys?","T12 to L3; right kidney slightly lower due to the liver."],
["Blood supply of the kidney?","Renal artery from the abdominal aorta, end-artery-like segmental branches; renal vein drains to IVC."],
["Name the parts of a nephron.","Renal corpuscle (glomerulus, Bowman's capsule), PCT, loop of Henle, DCT, collecting duct."],
["Describe the three constrictions of the ureter.","Pelviureteric junction, crossing the pelvic brim, and vesicoureteric junction (common sites for stones)."],

["Blood supply and lymphatic drainage of the testis?","Testicular artery from the aorta; drains to para-aortic nodes."],
["Parts of the epididymis?","Head, body and tail."],
["Components of the penis?","Two corpora cavernosa and one corpus spongiosum, with the urethra in the latter."],
["Blood supply of the uterus?","Uterine artery (internal iliac) with anastomosis from the ovarian artery."],

["Name key properties of X-rays.","Invisible, travel in straight lines, penetrate matter, cause fluorescence, ionise and affect photographic film."],
["What makes bone appear white on an X-ray?","It absorbs more X-rays (radiopaque); air is black (radiolucent)."],
["Name contrast media used in barium studies.","Barium sulphate for the GI tract; iodinated contrast for vessels and urinary tract."],

["What does PET detect?","Metabolic activity using positron-emitting tracers such as FDG."]]},

C.forEach((c,n)=>{if(X[n])c.q.push(...X[n]);c.q.forEach((q,k)=>{if(q[2]===undefined)q[2]=(K[n]||[])[k]||""})});
const $=id=>document.getElementById(id);
let S={m:{},b:0},cur=null,deck=[],i=0,streak=0,done=0;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("anat")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("anat",JSON.stringify(S))}catch(e){}};
const show=v=>["home","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==v));
function home(){
  show("home");let tot=0,got=0;
  $("list").innerHTML=C.map((c,n)=>{const m=(S.m[n]||[]).length;tot+=c.q.length;got+=m;
    return `<button class="row in" style="animation-delay:${n*45}ms" data-n="${n}"><span class="em">${c.e}</span><span class="t"><div>${n+1}. ${c.t}</div><small>${c.q.length} cards</small></span><span class="p">${m}/${c.q.length}</span></button>`}).join("");
  $("sm").textContent=got;$("st").textContent=tot;$("sb").textContent=S.b;
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>start(+r.dataset.n));
}
function start(n,only){
  cur=n;const all=C[n].q.map((q,k)=>k);
  deck=(only||all).slice().sort(()=>Math.random()-.5);i=0;streak=0;done=0;
  show("game");draw();
}
function draw(){
  if(i>=deck.length)return finish();
  const q=C[cur].q[deck[i]];$("cd").classList.remove("f");const sc=document.querySelector(".scene");sc.classList.remove("ent");void sc.offsetWidth;sc.classList.add("ent");
  $("qq").textContent=q[0];$("m1").textContent=C[cur].t;$("c1").textContent=$("c2").textContent=q[2]||"";$("aa").textContent=q[1];
  $("ct").textContent=(i+1)+"/"+deck.length;$("pb").style.width=(i/deck.length*100)+"%";
  $("ac").classList.remove("on");
}
function flip(){const c=$("cd");c.classList.toggle("f");const f=c.classList.contains("f");$("ac").classList.toggle("on",f);0}
function ans(good){
  if(!$("cd").classList.contains("f"))return;
  const k=deck[i];S.m[cur]=S.m[cur]||[];
  if(good){if(!S.m[cur].includes(k))S.m[cur].push(k);streak++;done++;S.b=Math.max(S.b,streak)}
  else{streak=0;deck.push(k)}
  save();i++;draw();
}
function finish(){
  const n=C[cur].q.length,m=(S.m[cur]||[]).length,full=m===n;
  $("pb").style.width="100%";show("end");
  $("end").innerHTML=`<div class="done"><div class="big">${full?"🎉":"📚"}</div><h2>${full?"Chapter mastered":"Round complete"}</h2><p class="sub">${C[cur].t}: ${m} of ${n} mastered · best streak ${S.b}</p><div class="acts"><button class="btn" id="e1">All chapters</button><button class="btn pr" id="e2">${full?"Practise again":"Study unmastered"}</button></div></div>`;
  $("e1").onclick=home;
  $("e2").onclick=()=>{const g=S.m[cur]||[],un=C[cur].q.map((q,k)=>k).filter(k=>!g.includes(k));if(full)S.m[cur]=[];start(cur,full||!un.length?null:un)};
}
$("cd").onclick=flip;$("ok").onclick=()=>ans(true);$("no").onclick=()=>ans(false);$("bk").onclick=home;
document.addEventListener("keydown",e=>{if($("game").classList.contains("hide"))return;
  if(e.code==="Space"){e.preventDefault();flip()}
  if(e.key==="ArrowRight")ans(true);if(e.key==="ArrowLeft")ans(false)});
home();
</script>
